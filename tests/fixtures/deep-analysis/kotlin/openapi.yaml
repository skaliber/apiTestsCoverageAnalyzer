openapi: "3.0.0"
info:
  title: Kotlin Deep Analysis Fixture API
  version: "1.0.0"
paths:
  /users:
    get:
      summary: List users
      responses:
        "200":
          description: List of users
    post:
      summary: Create user
      responses:
        "201":
          description: User created
  /users/{id}:
    get:
      summary: Get user by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User found
        "404":
          description: User not found
  /orders:
    post:
      summary: Create order
      responses:
        "201":
          description: Order created
