openapi: "3.0.3"
info:
  title: Financial Accounts & Transactions API
  description: |
    A complete REST API for managing financial accounts, transactions,
    fund transfers, spending limits, monthly statements, payment cards,
    and merchant data.  All endpoints require JWT Bearer authentication
    except /auth/token and /auth/refresh.
  version: "1.0.0"
  contact:
    name: FinAPI Engineering
    email: engineering@finapi.example.com

servers:
  - url: http://localhost:8000
    description: Local development server

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ---- Auth ----
    TokenRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }

    TokenResponse:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, example: bearer }
        expires_in: { type: integer, example: 1800 }

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    # ---- Account ----
    AccountCreate:
      type: object
      required: [account_type]
      properties:
        account_type:
          type: string
          enum: [checking, savings, investment]
        currency:
          type: string
          default: USD
          minLength: 3
          maxLength: 3
        initial_deposit:
          type: number
          format: decimal
          default: 0.00
          minimum: 0
        nickname:
          type: string
          maxLength: 100

    AccountUpdate:
      type: object
      properties:
        nickname:
          type: string
          maxLength: 100
        status:
          type: string
          enum: [active, suspended, closed, pending]

    Account:
      type: object
      properties:
        id: { type: string }
        owner_id: { type: string }
        account_number: { type: string }
        account_type: { type: string, enum: [checking, savings, investment] }
        status: { type: string, enum: [active, suspended, closed, pending] }
        currency: { type: string }
        available_balance: { type: number, format: decimal }
        current_balance: { type: number, format: decimal }
        nickname: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AccountBalance:
      type: object
      properties:
        account_id: { type: string }
        available_balance: { type: number, format: decimal }
        current_balance: { type: number, format: decimal }
        pending_amount: { type: number, format: decimal }
        currency: { type: string }
        as_of: { type: string, format: date-time }

    AccountSummary:
      type: object
      properties:
        account_id: { type: string }
        account_type: { type: string }
        status: { type: string }
        currency: { type: string }
        available_balance: { type: number }
        current_balance: { type: number }
        total_transactions: { type: integer }
        last_transaction_at: { type: string, format: date-time, nullable: true }
        monthly_spending: { type: number }
        monthly_income: { type: number }

    AccountList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Account' }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }

    # ---- Transaction ----
    TransactionCreate:
      type: object
      required: [account_id, amount, transaction_type, description]
      properties:
        account_id: { type: string }
        amount: { type: number, format: decimal, exclusiveMinimum: 0 }
        transaction_type:
          type: string
          enum: [debit, credit, transfer, fee, interest]
        description: { type: string, minLength: 1, maxLength: 500 }
        idempotency_key: { type: string, maxLength: 64 }
        merchant_id: { type: string, nullable: true }
        metadata:
          type: object
          additionalProperties: true
          nullable: true

    Transaction:
      type: object
      properties:
        id: { type: string }
        account_id: { type: string }
        amount: { type: number, format: decimal }
        transaction_type: { type: string }
        status: { type: string, enum: [pending, completed, failed, reversed] }
        description: { type: string }
        idempotency_key: { type: string, nullable: true }
        merchant_id: { type: string, nullable: true }
        metadata: { type: object, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TransactionList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Transaction' }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }

    # ---- Transfer ----
    TransferCreate:
      type: object
      required: [source_account_id, destination_account_id, amount, description]
      properties:
        source_account_id: { type: string }
        destination_account_id: { type: string }
        amount: { type: number, format: decimal, exclusiveMinimum: 0 }
        description: { type: string, minLength: 1, maxLength: 500 }
        idempotency_key: { type: string, maxLength: 64 }

    Transfer:
      type: object
      properties:
        id: { type: string }
        source_account_id: { type: string }
        destination_account_id: { type: string }
        amount: { type: number, format: decimal }
        description: { type: string }
        status: { type: string, enum: [pending, completed, failed, reversed] }
        idempotency_key: { type: string, nullable: true }
        fee: { type: number, format: decimal }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ---- Limits ----
    LimitUpdate:
      type: object
      required: [limit_type, amount]
      properties:
        limit_type:
          type: string
          enum: [daily_transfer, single_transaction, monthly_spending, atm_withdrawal]
        amount: { type: number, format: decimal, exclusiveMinimum: 0 }

    Limit:
      type: object
      properties:
        limit_type: { type: string }
        amount: { type: number, format: decimal }
        used_today: { type: number, format: decimal }
        remaining: { type: number, format: decimal }
        reset_at: { type: string, format: date-time }

    AccountLimits:
      type: object
      properties:
        account_id: { type: string }
        limits:
          type: array
          items: { $ref: '#/components/schemas/Limit' }
        updated_at: { type: string, format: date-time }

    # ---- Statement ----
    StatementSummary:
      type: object
      properties:
        month: { type: string, pattern: '^\d{4}-\d{2}$' }
        status: { type: string, enum: [available, processing] }
        closing_balance: { type: number, format: decimal }
        total_transactions: { type: integer }

    StatementList:
      type: object
      properties:
        account_id: { type: string }
        statements:
          type: array
          items: { $ref: '#/components/schemas/StatementSummary' }

    StatementEntry:
      type: object
      properties:
        date: { type: string, format: date }
        description: { type: string }
        amount: { type: number, format: decimal }
        balance: { type: number, format: decimal }
        transaction_type: { type: string }

    Statement:
      type: object
      properties:
        account_id: { type: string }
        month: { type: string }
        status: { type: string }
        opening_balance: { type: number, format: decimal }
        closing_balance: { type: number, format: decimal }
        total_credits: { type: number, format: decimal }
        total_debits: { type: number, format: decimal }
        entries:
          type: array
          items: { $ref: '#/components/schemas/StatementEntry' }
        generated_at: { type: string, format: date-time }

    # ---- Card ----
    CardCreate:
      type: object
      required: [account_id, card_type, cardholder_name]
      properties:
        account_id: { type: string }
        card_type: { type: string, enum: [debit, credit, prepaid] }
        cardholder_name: { type: string, minLength: 2, maxLength: 100 }

    CardStatusUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [active, inactive, suspended, cancelled] }
        reason: { type: string, maxLength: 300 }

    Card:
      type: object
      properties:
        id: { type: string }
        account_id: { type: string }
        card_type: { type: string }
        status: { type: string }
        cardholder_name: { type: string }
        last_four: { type: string }
        expiry_month: { type: integer }
        expiry_year: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ---- Merchant ----
    Merchant:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        mcc_code: { type: string }
        country: { type: string }
        is_active: { type: boolean }

    MerchantList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Merchant' }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }

    # ---- Admin ----
    HealthCheck:
      type: object
      properties:
        status: { type: string }
        version: { type: string }
        environment: { type: string }
        uptime_seconds: { type: number }
        database: { type: string }
        timestamp: { type: string, format: date-time }

    SystemStats:
      type: object
      properties:
        total_accounts: { type: integer }
        active_accounts: { type: integer }
        suspended_accounts: { type: integer }
        closed_accounts: { type: integer }
        total_transactions_today: { type: integer }
        total_volume_today: { type: number, format: decimal }
        total_cards: { type: integer }
        active_cards: { type: integer }
        uptime_seconds: { type: number }
        timestamp: { type: string, format: date-time }

    # ---- Error ----
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
        details:
          type: array
          nullable: true
          items:
            type: object
            properties:
              code: { type: string }
              message: { type: string }
              field: { type: string, nullable: true }
        request_id: { type: string, nullable: true }

paths:
  /auth/token:
    post:
      operationId: loginToken
      summary: Obtain access and refresh tokens
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: Tokens returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/refresh:
    post:
      operationId: refreshToken
      summary: Refresh an access token
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        "401":
          description: Invalid refresh token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /accounts:
    post:
      operationId: createAccount
      summary: Open a new account
      tags: [accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountCreate' }
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        "422": { description: Validation error }
    get:
      operationId: listAccounts
      summary: List accounts owned by the current user
      tags: [accounts]
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Account list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountList' }
        "401": { description: Unauthorized }

  /accounts/{account_id}:
    get:
      operationId: getAccount
      summary: Retrieve a single account
      tags: [accounts]
      parameters:
        - name: account_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Account details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        "403": { description: Forbidden }
        "404": { description: Not found }
    put:
      operationId: updateAccount
      summary: Update account metadata or status
      tags: [accounts]
      parameters:
        - name: account_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountUpdate' }
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        "403": { description: Forbidden }
        "404": { description: Not found }
    delete:
      operationId: deleteAccount
      summary: Close an account (must have zero balance)
      tags: [accounts]
      parameters:
        - name: account_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Account closed }
        "400": { description: Non-zero balance or already closed }
        "403": { description: Forbidden }
        "404": { description: Not found }

  /accounts/{account_id}/balance:
    get:
      operationId: getAccountBalance
      summary: Get current balance details
      tags: [accounts]
      parameters:
        - name: account_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Balance details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountBalance' }
        "403": { description: Forbidden }
        "404": { description: Not found }

  /accounts/{account_id}/summary:
    get:
      operationId: getAccountSummary
      summary: Get account activity summary
      tags: [accounts]
      parameters:
        - name: account_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Account summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountSummary' }
        "403": { description: Forbidden }
        "404": { description: Not found }

  /transactions:
    post:
      operationId: createTransaction
      summary: Post a new transaction
      tags: [transactions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionCreate' }
      responses:
        "201":
          description: Transaction created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        "400": { description: Insufficient funds, suspended/closed account }
        "403": { description: Forbidden }
        "404": { description: Account not found }
    get:
      operationId: listTransactions
      summary: List transactions
      tags: [transactions]
      parameters:
        - name: account_id
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Transaction list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionList' }
        "401": { description: Unauthorized }

  /transactions/{transaction_id}:
    get:
      operationId: getTransaction
      summary: Retrieve a transaction by ID
      tags: [transactions]
      parameters:
        - name: transaction_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Transaction details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        "403": { description: Forbidden }
        "404": { description: Not found }

  /transfers:
    post:
      operationId: createTransfer
      summary: Transfer funds between accounts
      tags: [transfers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferCreate' }
      responses:
        "201":
          description: Transfer completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transfer' }
        "400": { description: Business rule violation }
        "403": { description: Forbidden }
        "404": { description: Account not found }

  /transfers/{transfer_id}:
    get:
      operationId: getTransfer
      summary: Retrieve a transfer by ID
      tags: [transfers]
      parameters:
        - name: transfer_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Transfer details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transfer' }
        "403": { description: Forbidden }
        "404": { description: Not found }

  /limits/{account_id}:
    get:
      operationId: getLimits
      summary: Get spending limits for an account
      tags: [limits]
      parameters:
        - name: account_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Account limits
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountLimits' }
        "403": { description: Forbidden }
        "404": { description: Not found }
    put:
      operationId: updateLimits
      summary: Update a spending limit
      tags: [limits]
      parameters:
        - name: account_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LimitUpdate' }
      responses:
        "200":
          description: Updated limits
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountLimits' }
        "403": { description: Forbidden }
        "404": { description: Not found }

  /statements/{account_id}:
    get:
      operationId: listStatements
      summary: List available statement periods
      tags: [statements]
      parameters:
        - name: account_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Statement list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatementList' }
        "403": { description: Forbidden }
        "404": { description: Not found }

  /statements/{account_id}/{month}:
    get:
      operationId: getStatement
      summary: Retrieve a detailed monthly statement (YYYY-MM)
      tags: [statements]
      parameters:
        - name: account_id
          in: path
          required: true
          schema: { type: string }
        - name: month
          in: path
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
      responses:
        "200":
          description: Statement details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Statement' }
        "400": { description: Invalid month format }
        "403": { description: Forbidden }
        "404": { description: Not found }

  /cards:
    post:
      operationId: issueCard
      summary: Issue a new card
      tags: [cards]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardCreate' }
      responses:
        "201":
          description: Card issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Card' }
        "400": { description: Cannot issue for closed account }
        "403": { description: Forbidden }
        "404": { description: Account not found }

  /cards/{card_id}:
    get:
      operationId: getCard
      summary: Retrieve a card by ID
      tags: [cards]
      parameters:
        - name: card_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Card details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Card' }
        "403": { description: Forbidden }
        "404": { description: Not found }
    delete:
      operationId: cancelCard
      summary: Cancel (permanently deactivate) a card
      tags: [cards]
      parameters:
        - name: card_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Card cancelled }
        "403": { description: Forbidden }
        "404": { description: Not found }

  /cards/{card_id}/status:
    put:
      operationId: updateCardStatus
      summary: Update card status (activate, suspend, cancel)
      tags: [cards]
      parameters:
        - name: card_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardStatusUpdate' }
      responses:
        "200":
          description: Updated card
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Card' }
        "400": { description: Cannot modify cancelled card }
        "403": { description: Forbidden }
        "404": { description: Not found }

  /merchants:
    get:
      operationId: listMerchants
      summary: List all merchants
      tags: [merchants]
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Merchant list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MerchantList' }
        "401": { description: Unauthorized }

  /merchants/{merchant_id}:
    get:
      operationId: getMerchant
      summary: Retrieve a merchant by ID
      tags: [merchants]
      parameters:
        - name: merchant_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Merchant details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Merchant' }
        "401": { description: Unauthorized }
        "404": { description: Not found }

  /admin/health:
    get:
      operationId: adminHealth
      summary: System health check (authenticated)
      tags: [admin]
      responses:
        "200":
          description: Health status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthCheck' }
        "401": { description: Unauthorized }

  /admin/stats:
    get:
      operationId: adminStats
      summary: Aggregated system statistics (admin only)
      tags: [admin]
      responses:
        "200":
          description: System statistics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemStats' }
        "401": { description: Unauthorized }
        "403": { description: Admin role required }
