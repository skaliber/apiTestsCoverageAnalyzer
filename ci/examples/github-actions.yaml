name: API Coverage Analysis

# Example GitHub Actions workflow for user projects.
# All steps call Makefile targets — no inline coverage logic.
# Pass/fail is governed by the analyzer's process exit code.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  api-coverage:
    name: Run API Test Coverage Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: make install

      - name: Build
        run: make build

      - name: Unit Tests
        run: make test-unit

      - name: Integration Tests
        run: make test-integration

      - name: Self-Analysis (all metrics)
        run: make self-analysis-all
        # Exits non-zero automatically when any threshold is breached.
        # Override thresholds via environment variables:
        #   env:
        #     THRESHOLD_ENDPOINT: '90'
        #     THRESHOLD_BUSINESS: '80'

      - name: Generate Summaries
        if: always()
        run: make summary

      - name: Post step summary
        if: always()
        run: |
          if [ -f reports/build-summary.md ]; then
            cat reports/build-summary.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: reports/
          retention-days: 30

      - name: Publish JUnit coverage results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          junit_files: 'reports/*-junit.xml'
          check_name: 'API Coverage Thresholds'
