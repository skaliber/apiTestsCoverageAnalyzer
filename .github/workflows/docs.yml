name: Deploy Documentation & Test Dashboard

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'dashboard/**'
      - 'cypress/**'
      - 'cypress.config.js'
      - 'cypress.dashboard.config.js'
      - 'scripts/docs-check.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'dashboard/**'
      - 'cypress/**'
      - 'cypress.config.js'
      - 'cypress.dashboard.config.js'
      - 'scripts/docs-check.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run docs pre-build checks
        run: node scripts/docs-check.js

      - name: Build documentation
        run: npm run docs:build

  build:
    needs: docs-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build documentation
        run: npm run docs:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  test-links:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build documentation
        run: npm run docs:build

      - name: Start docs preview server
        run: npm run docs:preview &
        env:
          NODE_ENV: production

      - name: Wait for preview server
        run: npx wait-on http://localhost:4173/apiTestsCoverageAnalyzer --timeout 30000

      - name: Run Cypress documentation link tests
        run: npm run docs:test

  test-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies (includes Cypress)
        run: npm ci

      - name: Install dashboard dependencies
        run: npm ci
        working-directory: dashboard

      - name: Build dashboard
        run: npm run build
        working-directory: dashboard

      - name: Start dashboard preview server
        run: npm run preview -- --host 127.0.0.1 &
        working-directory: dashboard
        env:
          NODE_ENV: production

      - name: Wait for dashboard preview server
        run: npx wait-on http://127.0.0.1:4173 --timeout 30000

      - name: Run Cypress dashboard tests
        run: npm run dashboard:test

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: [test-links, test-dashboard]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

