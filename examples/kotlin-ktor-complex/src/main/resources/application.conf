ktor {
    deployment {
        port = 8080
        port = ${?PORT}
        host = "0.0.0.0"
        connectionGroupSize = 2
        workerGroupSize = 5
        callGroupSize = 10
    }
    application {
        modules = [ com.example.healthcare.ApplicationKt.module ]
    }
}

jwt {
    secret = "healthcare-jwt-secret-key-change-in-production"
    secret = ${?JWT_SECRET}
    issuer = "healthcare-app"
    audience = "healthcare-users"
    expirationSeconds = 86400
}

database {
    # In production, these would connect to a real database
    host = "localhost"
    host = ${?DB_HOST}
    port = 5432
    port = ${?DB_PORT}
    name = "healthcare"
    name = ${?DB_NAME}
    user = "postgres"
    user = ${?DB_USER}
    password = "postgres"
    password = ${?DB_PASSWORD}
}

notifications {
    smtp {
        host = "smtp.example.com"
        host = ${?SMTP_HOST}
        port = 587
        port = ${?SMTP_PORT}
        username = "noreply@healthcare.example.com"
        username = ${?SMTP_USER}
        password = ${?SMTP_PASSWORD}
    }
    sms {
        provider = "twilio"
        accountSid = ${?TWILIO_ACCOUNT_SID}
        authToken = ${?TWILIO_AUTH_TOKEN}
        fromNumber = ${?TWILIO_FROM_NUMBER}
    }
}

healthcare {
    appointmentAdvanceHours = 24
    cancellationFeeAmount = 50.0
    cancellationFeeWindowHours = 24
    maxAppointmentDurationMinutes = 240
    minAppointmentDurationMinutes = 15
    twoFactorCodeExpiryMinutes = 15
}
