name: API Test Coverage Analysis

on:
  push:
    branches: ["main", "develop", "feature/**"]
  pull_request:
    branches: ["main", "develop"]

# Concurrency: cancel in-progress runs for the same branch on new push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # 1. Run tests with the initial (partial) test suite – demonstrates gaps
  # --------------------------------------------------------------------------
  test-initial:
    name: "Tests (Initial Suite – ~55% coverage)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/python-fastapi-complex

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: examples/python-fastapi-complex/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run initial test suite
        run: |
          python -m pytest tests/tests-initial/ \
            -v \
            --tb=short \
            --junitxml=test-results-initial.xml

      - name: Upload initial test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-initial
          path: examples/python-fastapi-complex/test-results-initial.xml

  # --------------------------------------------------------------------------
  # 2. Analyze coverage of the initial test suite (shows ~55% coverage)
  # --------------------------------------------------------------------------
  analyze-initial:
    name: "Coverage Analysis (Initial Suite)"
    runs-on: ubuntu-latest
    needs: test-initial
    defaults:
      run:
        working-directory: examples/python-fastapi-complex

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: examples/python-fastapi-complex/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run coverage analyzer on initial test suite
        run: |
          npx apiTestsCoverageAnalyzer \
            --config config.yaml \
            --test-dir tests/tests-initial \
            --output-dir reports/analysis-initial \
            --no-fail-on-threshold
        continue-on-error: true  # Expected to show low coverage

      - name: Upload initial analysis reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-analysis-initial
          path: examples/python-fastapi-complex/reports/analysis-initial/

  # --------------------------------------------------------------------------
  # 3. Run the complete test suite
  # --------------------------------------------------------------------------
  test-complete:
    name: "Tests (Complete Suite – 100% coverage)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/python-fastapi-complex

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: examples/python-fastapi-complex/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run complete test suite
        run: |
          python -m pytest tests/tests-complete/ \
            -v \
            --tb=short \
            --junitxml=test-results-complete.xml

      - name: Upload complete test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-complete
          path: examples/python-fastapi-complex/test-results-complete.xml

  # --------------------------------------------------------------------------
  # 4. Analyze coverage of the complete test suite (expected 100%)
  # --------------------------------------------------------------------------
  analyze-complete:
    name: "Coverage Analysis (Complete Suite – Quality Gate)"
    runs-on: ubuntu-latest
    needs: test-complete
    defaults:
      run:
        working-directory: examples/python-fastapi-complex

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: examples/python-fastapi-complex/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run coverage analyzer on complete test suite
        run: |
          npx apiTestsCoverageAnalyzer \
            --config config.yaml \
            --test-dir tests/tests-complete \
            --output-dir reports/analysis-complete

      - name: Upload complete analysis reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-analysis-complete
          path: examples/python-fastapi-complex/reports/analysis-complete/

      - name: Summarize coverage results
        run: |
          echo "## Coverage Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f reports/analysis-complete/summary.json ]; then
            cat reports/analysis-complete/summary.json >> $GITHUB_STEP_SUMMARY
          else
            echo "Report file not found" >> $GITHUB_STEP_SUMMARY
          fi
