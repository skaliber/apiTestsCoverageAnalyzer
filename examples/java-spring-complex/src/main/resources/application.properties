# Application
spring.application.name=java-spring-complex-orders-api
server.port=8080

# Database (H2 for development/testing)
spring.datasource.url=jdbc:h2:mem:ordersdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (development only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security / JWT
jwt.secret=ecommerce-orders-super-secret-key-change-in-production-min-256-bits
jwt.expiration.ms=86400000

# Logging
logging.level.com.example.orders=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Payment Gateway (mock configuration)
payment.gateway.url=https://sandbox.payment-gateway.example.com
payment.gateway.api-key=test-api-key-sandbox
payment.gateway.timeout.ms=5000

# Business Rule Thresholds
business.max-order-amount=10000.00
business.refund-window-days=30
business.max-items-per-order=50
