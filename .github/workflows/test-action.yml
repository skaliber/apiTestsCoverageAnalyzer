name: Test GitHub Action

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'action/**'
      - '.github/workflows/test-action.yml'
      - 'tsconfig.json'
  pull_request:
    paths:
      - 'src/**'
      - 'action/**'
      - '.github/workflows/test-action.yml'
      - 'tsconfig.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build library and action
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm test

      - name: Run coverage analyzer
        run: npm run coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: reports/
          retention-days: 7

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  test-action-endpoint:
    name: Test action – endpoint coverage
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Run endpoint coverage via action
        uses: ./action
        with:
          spec: 'sample/openapi.yaml'
          tests: 'sample/tests/**/*.ts'
          format: 'json,html,csv,junit'
          coverage-types: 'endpoint'
          threshold-endpoint: '0'

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-endpoint
          path: reports/
          retention-days: 7

  test-action-multi:
    name: Test action – multiple coverage types
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Run multiple coverage types
        id: coverage
        uses: ./action
        with:
          spec: 'sample/openapi.yaml'
          tests: 'sample/tests/**/*.ts'
          format: 'json,html'
          coverage-types: 'endpoint,error,security'

      - name: Print endpoint coverage
        run: echo "Endpoint coverage ${{ steps.coverage.outputs.endpoint-coverage }}%"

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-multi
          path: reports/
          retention-days: 7

  test-action-threshold-fail:
    name: Test action – threshold failure
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Run coverage with impossible threshold (expect failure)
        id: coverage-fail
        continue-on-error: true
        uses: ./action
        with:
          spec: 'sample/openapi.yaml'
          tests: 'sample/tests/**/*.ts'
          coverage-types: 'endpoint'
          threshold-endpoint: '100'

      - name: Assert action failed as expected
        if: steps.coverage-fail.outcome == 'success'
        run: |
          echo "ERROR: Action should have failed with threshold=100 but succeeded"
          exit 1

      - name: Confirm failure was detected
        if: steps.coverage-fail.outcome == 'failure'
        run: echo "Threshold failure correctly detected (exit code was non-zero)"
