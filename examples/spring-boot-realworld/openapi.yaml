openapi: "3.0.3"
info:
  title: Spring Boot RealWorld Conduit API
  version: "1.0.0"
  description: Minimal fixture for Feature 27 DDD + MyBatis + DGS pattern detection.
paths:
  /api/articles:
    get:
      summary: List articles
      operationId: listArticles
      parameters:
        - name: tag
          in: query
          schema:
            type: string
        - name: author
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
    post:
      summary: Create article
      operationId: createArticle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: Created
  /api/articles/{slug}:
    get:
      summary: Get article
      operationId: getArticle
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
    put:
      summary: Update article
      operationId: updateArticle
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
    delete:
      summary: Delete article
      operationId: deleteArticle
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /api/users/login:
    post:
      summary: Login
      operationId: loginUser
      responses:
        "200":
          description: OK
  /api/users:
    post:
      summary: Register
      operationId: registerUser
      responses:
        "201":
          description: Created
  /api/users/me:
    get:
      summary: Get current user
      operationId: getCurrentUser
      responses:
        "200":
          description: OK
    put:
      summary: Update user
      operationId: updateUser
      responses:
        "200":
          description: OK
  /api/profiles/{username}:
    get:
      summary: Get profile
      operationId: getProfile
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /api/profiles/{username}/follow:
    post:
      summary: Follow user
      operationId: followUser
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
    delete:
      summary: Unfollow user
      operationId: unfollowUser
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
components:
  schemas:
    Article:
      type: object
      properties:
        slug:
          type: string
        title:
          type: string
        description:
          type: string
        body:
          type: string
