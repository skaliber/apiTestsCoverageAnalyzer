openapi: 3.0.3
info:
  title: E-Commerce Orders API
  description: |
    Comprehensive RESTful API for an e-commerce orders platform.
    Supports user management, product catalog, order lifecycle, payments,
    refunds, shipments, reviews, and administrative operations.
  version: 1.0.0
  contact:
    name: API Support
    email: api-support@example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://api.orders.example.com
    description: Production server

tags:
  - name: Users
    description: User account management
  - name: Products
    description: Product catalog and inventory
  - name: Orders
    description: Order creation and lifecycle management
  - name: Payments
    description: Payment processing and capture
  - name: Refunds
    description: Refund processing
  - name: Shipments
    description: Shipment tracking and status
  - name: Reviews
    description: Product reviews
  - name: Admin
    description: Administrative operations (requires ADMIN role)

security:
  - bearerAuth: []

paths:

  # ─────────────────────────────────────────
  # Users
  # ─────────────────────────────────────────

  /users:
    post:
      tags: [Users]
      operationId: createUser
      summary: Register a new user
      description: Creates a new customer account. This endpoint is publicly accessible.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            example:
              name: Jane Doe
              email: jane.doe@example.com
              password: Secure@Pass123
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Validation error or email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags: [Users]
      operationId: listUsers
      summary: List all users (admin only)
      description: Returns a paginated list of all users. Requires ADMIN role.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: email
          in: query
          description: Filter by email (partial match)
          schema:
            type: string
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{id}:
    get:
      tags: [Users]
      operationId: getUserById
      summary: Get user by ID
      description: Returns user details. Accessible by the user themselves or an ADMIN.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Users]
      operationId: updateUser
      summary: Update user profile
      description: Updates name, email, or password. Accessible by the user themselves or an ADMIN.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Users]
      operationId: deleteUser
      summary: Delete user account (admin only)
      description: |
        Permanently deletes a user account.
        Business Rule: user-deletion-requires-admin
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ─────────────────────────────────────────
  # Products
  # ─────────────────────────────────────────

  /products:
    get:
      tags: [Products]
      operationId: listProducts
      summary: List products
      description: Returns a paginated, filterable list of active products. Public endpoint.
      security: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: category
          in: query
          schema:
            type: string
        - name: search
          in: query
          description: Full-text search on name and description
          schema:
            type: string
        - name: minPrice
          in: query
          schema:
            type: number
            format: double
        - name: maxPrice
          in: query
          schema:
            type: number
            format: double
        - name: sortBy
          in: query
          schema:
            type: string
            default: name
            enum: [name, price, createdAt]
        - name: sortDir
          in: query
          schema:
            type: string
            default: asc
            enum: [asc, desc]
      responses:
        '200':
          description: Paginated product list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'

    post:
      tags: [Products]
      operationId: createProduct
      summary: Create product (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: SKU already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /products/{id}:
    get:
      tags: [Products]
      operationId: getProductById
      summary: Get product by ID
      security: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Products]
      operationId: updateProduct
      summary: Update product (admin only)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: Updated product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Products]
      operationId: deleteProduct
      summary: Delete product (admin only)
      description: Soft-deletes the product by marking it inactive.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Product deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /products/{id}/reviews:
    get:
      tags: [Reviews, Products]
      operationId: getProductReviews
      summary: Get reviews for a product
      security: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: List of reviews for the product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewPage'
        '404':
          $ref: '#/components/responses/NotFound'

  # ─────────────────────────────────────────
  # Orders
  # ─────────────────────────────────────────

  /orders:
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Create a new order
      description: |
        Creates a new order for the authenticated user.
        Business Rules:
        - only-authenticated-users-can-place-orders
        - duplicate-order-prevention (via Idempotency-Key header)
      parameters:
        - name: Idempotency-Key
          in: header
          description: Unique key to prevent duplicate orders
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Duplicate order (idempotency key already used)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags: [Orders]
      operationId: listOrders
      summary: List orders for the current user
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, CONFIRMED, PROCESSING, SHIPPED, DELIVERED, CANCELLED, REFUNDED]
      responses:
        '200':
          description: Paginated order list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /orders/{id}:
    get:
      tags: [Orders]
      operationId: getOrderById
      summary: Get order by ID
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Orders]
      operationId: cancelOrder
      summary: Cancel an order
      description: Cancels a PENDING or CONFIRMED order. Cannot cancel shipped/delivered orders.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Order cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Order cannot be cancelled in current status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/{id}/status:
    put:
      tags: [Orders]
      operationId: updateOrderStatus
      summary: Update order status
      description: Updates the status of an order. Admin can update any status; customers can only cancel.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [PENDING, CONFIRMED, PROCESSING, SHIPPED, DELIVERED, CANCELLED, REFUNDED]
      responses:
        '200':
          description: Updated order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/{id}/items:
    post:
      tags: [Orders]
      operationId: addOrderItem
      summary: Add item to order
      description: |
        Adds a product to a PENDING order.
        Business Rules:
        - inventory-check-before-order
        - max-order-amount-10000
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddOrderItemRequest'
      responses:
        '201':
          description: Item added to order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Insufficient stock or order amount limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/{id}/items/{itemId}:
    delete:
      tags: [Orders]
      operationId: removeOrderItem
      summary: Remove item from order
      description: Removes an item from a PENDING order and restores inventory.
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Item removed from order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Cannot remove item from order in current status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─────────────────────────────────────────
  # Payments
  # ─────────────────────────────────────────

  /payments:
    post:
      tags: [Payments]
      operationId: initiatePayment
      summary: Initiate payment for an order
      description: Creates a payment authorization for an order. Payment starts in AUTHORIZED state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitiatePaymentRequest'
      responses:
        '201':
          description: Payment initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Order already paid or cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /payments/{id}:
    get:
      tags: [Payments]
      operationId: getPaymentById
      summary: Get payment details
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Payment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /payments/{id}/capture:
    post:
      tags: [Payments]
      operationId: capturePayment
      summary: Capture an authorized payment
      description: |
        Captures a previously authorized payment and moves the order to PROCESSING.
        Business Rule: payment-required-before-shipment (captured payments enable shipment)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Payment captured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Payment is not in AUTHORIZED state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /payments/{id}/void:
    post:
      tags: [Payments]
      operationId: voidPayment
      summary: Void an authorized payment
      description: Voids a PENDING or AUTHORIZED payment. Cannot void captured payments (use refund instead).
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Payment voided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Payment cannot be voided in current state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─────────────────────────────────────────
  # Refunds
  # ─────────────────────────────────────────

  /refunds:
    post:
      tags: [Refunds]
      operationId: createRefund
      summary: Request a refund
      description: |
        Creates a refund for a captured payment.
        Business Rule: refund-window-30-days — refunds must be requested within 30 days of capture.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRefundRequest'
      responses:
        '201':
          description: Refund created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Refund window expired, amount exceeds payment, or payment not captured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /refunds/{id}:
    get:
      tags: [Refunds]
      operationId: getRefundById
      summary: Get refund details
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Refund details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ─────────────────────────────────────────
  # Shipments
  # ─────────────────────────────────────────

  /shipments/{id}:
    get:
      tags: [Shipments]
      operationId: getShipmentById
      summary: Get shipment details
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Shipment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /shipments/{id}/status:
    put:
      tags: [Shipments]
      operationId: updateShipmentStatus
      summary: Update shipment status (admin only)
      description: |
        Updates the shipment status. Moving to SHIPPED requires a captured payment.
        Business Rule: payment-required-before-shipment
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateShipmentStatusRequest'
      responses:
        '200':
          description: Shipment status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Payment not captured or invalid status transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─────────────────────────────────────────
  # Reviews
  # ─────────────────────────────────────────

  /reviews:
    post:
      tags: [Reviews]
      operationId: createReview
      summary: Submit a product review
      description: |
        Allows authenticated users to review a product.
        Business Rule: review-requires-completed-order — user must have a completed order containing the product.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
      responses:
        '201':
          description: Review submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: User has no completed order for this product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─────────────────────────────────────────
  # Admin
  # ─────────────────────────────────────────

  /admin/health:
    get:
      tags: [Admin]
      operationId: getSystemHealth
      summary: System health check
      description: Returns the health status of the application and its dependencies.
      responses:
        '200':
          description: System is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: System is degraded or down
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /admin/metrics:
    get:
      tags: [Admin]
      operationId: getSystemMetrics
      summary: System metrics
      description: Returns JVM memory, thread counts, and application-level business metrics.
      responses:
        '200':
          description: System metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

# ─────────────────────────────────────────
# Components
# ─────────────────────────────────────────

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from the authentication endpoint

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Resource unique identifier

  responses:
    BadRequest:
      description: Invalid request data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:

    # ── User ──

    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [CUSTOMER, ADMIN]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateUserRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    # ── Product ──

    Product:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
        stockQuantity:
          type: integer
        category:
          type: string
        sku:
          type: string
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time

    CreateProductRequest:
      type: object
      required: [name, price, stockQuantity, category, sku]
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
          minimum: 0.01
        stockQuantity:
          type: integer
          minimum: 0
        category:
          type: string
        sku:
          type: string

    UpdateProductRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
        stockQuantity:
          type: integer
        category:
          type: string

    ProductPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        totalElements:
          type: integer
        totalPages:
          type: integer
        size:
          type: integer
        number:
          type: integer

    # ── Order ──

    Order:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        status:
          type: string
          enum: [PENDING, CONFIRMED, PROCESSING, SHIPPED, DELIVERED, CANCELLED, REFUNDED]
        totalAmount:
          type: number
          format: double
        idempotencyKey:
          type: string
        shippingAddress:
          type: string
        notes:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateOrderRequest:
      type: object
      properties:
        shippingAddress:
          type: string
        notes:
          type: string

    OrderPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        totalElements:
          type: integer
        totalPages:
          type: integer
        size:
          type: integer
        number:
          type: integer

    OrderItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
        productName:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
          format: double
        subtotal:
          type: number
          format: double

    AddOrderItemRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: integer
          format: int64
        quantity:
          type: integer
          minimum: 1

    # ── Payment ──

    Payment:
      type: object
      properties:
        id:
          type: integer
          format: int64
        orderId:
          type: integer
          format: int64
        status:
          type: string
          enum: [PENDING, AUTHORIZED, CAPTURED, VOIDED, REFUNDED, FAILED]
        amount:
          type: number
          format: double
        paymentMethod:
          type: string
        transactionId:
          type: string
        gatewayReference:
          type: string
        capturedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    InitiatePaymentRequest:
      type: object
      required: [orderId, paymentMethod]
      properties:
        orderId:
          type: integer
          format: int64
        paymentMethod:
          type: string
          enum: [CREDIT_CARD, DEBIT_CARD, PAYPAL, BANK_TRANSFER, CRYPTO]
        cardToken:
          type: string
          description: Tokenized card reference from payment gateway

    # ── Refund ──

    Refund:
      type: object
      properties:
        id:
          type: integer
          format: int64
        paymentId:
          type: integer
          format: int64
        status:
          type: string
          enum: [PENDING, PROCESSING, COMPLETED, FAILED, REJECTED]
        amount:
          type: number
          format: double
        reason:
          type: string
        gatewayRefundId:
          type: string
        createdAt:
          type: string
          format: date-time

    CreateRefundRequest:
      type: object
      required: [paymentId, amount]
      properties:
        paymentId:
          type: integer
          format: int64
        amount:
          type: number
          format: double
          minimum: 0.01
        reason:
          type: string

    # ── Shipment ──

    Shipment:
      type: object
      properties:
        id:
          type: integer
          format: int64
        orderId:
          type: integer
          format: int64
        status:
          type: string
          enum: [PENDING, READY_TO_SHIP, SHIPPED, IN_TRANSIT, OUT_FOR_DELIVERY, DELIVERED, FAILED, RETURNED]
        carrier:
          type: string
        trackingNumber:
          type: string
        shippingMethod:
          type: string
        estimatedDelivery:
          type: string
          format: date-time
        shippedAt:
          type: string
          format: date-time
        deliveredAt:
          type: string
          format: date-time

    UpdateShipmentStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [PENDING, READY_TO_SHIP, SHIPPED, IN_TRANSIT, OUT_FOR_DELIVERY, DELIVERED, FAILED, RETURNED]
        trackingNumber:
          type: string
        carrier:
          type: string
        estimatedDelivery:
          type: string
          format: date-time

    # ── Review ──

    Review:
      type: object
      properties:
        id:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
        orderId:
          type: integer
          format: int64
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
        author:
          type: string
        createdAt:
          type: string
          format: date-time

    CreateReviewRequest:
      type: object
      required: [productId, orderId, rating]
      properties:
        productId:
          type: integer
          format: int64
        orderId:
          type: integer
          format: int64
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 2000

    ReviewPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Review'
        totalElements:
          type: integer
        totalPages:
          type: integer

    # ── Admin ──

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [UP, DOWN, DEGRADED]
        timestamp:
          type: string
          format: date-time
        version:
          type: string
        components:
          type: object
          additionalProperties:
            type: string

    MetricsResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        uptimeMs:
          type: integer
          format: int64
        memory:
          type: object
          properties:
            heapUsed:
              type: integer
              format: int64
            heapMax:
              type: integer
              format: int64
            nonHeapUsed:
              type: integer
              format: int64
        jvm:
          type: object
          properties:
            version:
              type: string
            threads:
              type: integer
        application:
          type: object
          properties:
            totalOrders:
              type: integer
            pendingOrders:
              type: integer
            totalRevenue:
              type: number
            activeUsers:
              type: integer

    # ── Shared ──

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        path:
          type: string

    MessageResponse:
      type: object
      properties:
        message:
          type: string
