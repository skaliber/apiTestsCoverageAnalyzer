openapi: "3.0.0"
info:
  title: Parameters Sample API
  version: "1.0.0"
paths:
  /users:
    post:
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                email:
                  type: string
                  format: email
                age:
                  type: integer
                  minimum: 0
                  maximum: 150
      responses:
        "201":
          description: User created
        "400":
          description: Invalid input
  /users/{id}:
    get:
      summary: Get a user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: fields
          in: query
          required: false
          schema:
            type: string
            enum:
              - name
              - email
              - age
      responses:
        "200":
          description: User found
        "400":
          description: Invalid ID format
        "404":
          description: User not found
  /items:
    get:
      summary: Search items
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 50
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: X-Api-Key
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Items found
        "400":
          description: Invalid query parameters
        "401":
          description: Missing or invalid API key
