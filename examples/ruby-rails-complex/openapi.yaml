openapi: "3.0.3"
info:
  title: User Management & Subscription Billing API
  version: "1.0.0"
  description: |
    A comprehensive API for managing users, subscriptions, invoices,
    usage tracking, seats, roles, plans, coupons, audit logs, and webhooks.
  contact:
    name: API Support
    email: api-support@example.com
  license:
    name: MIT

servers:
  - url: http://localhost:3000/api/v1
    description: Local development server
  - url: https://api.example.com/api/v1
    description: Production server

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        company_name:
          type: string
        phone:
          type: string
        timezone:
          type: string
        role:
          type: string
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Subscription:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        plan:
          $ref: "#/components/schemas/Plan"
        status:
          type: string
          enum: [trialing, active, past_due, cancelled, expired]
        current_period_start:
          type: string
          format: date-time
        current_period_end:
          type: string
          format: date-time
        cancel_at_period_end:
          type: boolean
        trial_end_date:
          type: string
          format: date-time
        seats_used:
          type: integer
        seats_limit:
          type: integer
        created_at:
          type: string
          format: date-time

    Invoice:
      type: object
      properties:
        id:
          type: integer
        subscription_id:
          type: integer
        amount:
          type: number
          format: float
        currency:
          type: string
        status:
          type: string
          enum: [pending, paid, past_due, void, refunded]
        due_date:
          type: string
          format: date-time
        paid_at:
          type: string
          format: date-time
        line_items:
          type: array
          items:
            type: object
        billing_period_start:
          type: string
          format: date-time
        billing_period_end:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    Plan:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: float
        currency:
          type: string
        billing_cycle:
          type: string
          enum: [monthly, yearly]
        seat_limit:
          type: integer
        usage_quota:
          type: integer
        features:
          type: array
          items:
            type: string
        popular:
          type: boolean
        active:
          type: boolean

    Seat:
      type: object
      properties:
        id:
          type: integer
        user:
          type: object
          properties:
            id:
              type: integer
            email:
              type: string
            name:
              type: string
        role:
          type: string
        status:
          type: string
        invited_at:
          type: string
          format: date-time
        activated_at:
          type: string
          format: date-time

    Role:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            type: string
        system_role:
          type: boolean
        users_count:
          type: integer
        created_at:
          type: string
          format: date-time

    AuditLog:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        user_email:
          type: string
        action:
          type: string
        resource_type:
          type: string
        resource_id:
          type: integer
        changes:
          type: object
        ip_address:
          type: string
        user_agent:
          type: string
        created_at:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        error:
          type: string
        errors:
          type: array
          items:
            type: string

    Pagination:
      type: object
      properties:
        current_page:
          type: integer
        total_pages:
          type: integer
        total_count:
          type: integer
        per_page:
          type: integer

  responses:
    Unauthorized:
      description: Unauthorized - invalid or missing authentication token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Forbidden - insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: Validation errors
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

paths:
  /users:
    get:
      operationId: listUsers
      summary: List all users
      tags: [Users]
      parameters:
        - name: page
          in: query
          schema: { type: integer }
        - name: per_page
          in: query
          schema: { type: integer, default: 25 }
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
                  meta:
                    $ref: "#/components/schemas/Pagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createUser
      summary: Create a new user
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, first_name, last_name]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                first_name:
                  type: string
                last_name:
                  type: string
                company_name:
                  type: string
                phone:
                  type: string
                timezone:
                  type: string
                role_id:
                  type: integer
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      operationId: getUser
      summary: Get a user by ID
      tags: [Users]
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateUser
      summary: Update a user
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                company_name:
                  type: string
                phone:
                  type: string
                timezone:
                  type: string
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      operationId: deleteUser
      summary: Delete (soft-delete) a user
      description: Requires admin role. Business rule - user-deletion-requires-admin.
      tags: [Users]
      responses:
        "200":
          description: User deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /subscriptions:
    post:
      operationId: createSubscription
      summary: Create a new subscription
      tags: [Subscriptions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_id]
              properties:
                plan_id:
                  type: integer
                coupon_code:
                  type: string
                payment_method_id:
                  type: string
                billing_cycle:
                  type: string
                  enum: [monthly, yearly]
      responses:
        "201":
          description: Subscription created
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /subscriptions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      operationId: getSubscription
      summary: Get a subscription
      tags: [Subscriptions]
      responses:
        "200":
          description: Subscription found
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateSubscription
      summary: Update a subscription
      tags: [Subscriptions]
      responses:
        "200":
          description: Subscription updated
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteSubscription
      summary: Immediately cancel a subscription
      tags: [Subscriptions]
      responses:
        "200":
          description: Subscription cancelled
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /subscriptions/{id}/upgrade:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
      - name: plan_id
        in: query
        required: true
        schema: { type: integer }
    get:
      operationId: upgradeSubscription
      summary: Upgrade or downgrade subscription plan
      description: Business rules - seat-limit-per-plan, subscription-downgrade-seats
      tags: [Subscriptions]
      responses:
        "200":
          description: Subscription plan changed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /subscriptions/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    post:
      operationId: cancelSubscription
      summary: Schedule subscription cancellation at period end
      description: Business rule - subscription-cancellation-period
      tags: [Subscriptions]
      responses:
        "200":
          description: Cancellation scheduled
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /invoices:
    get:
      operationId: listInvoices
      summary: List invoices for current user
      tags: [Invoices]
      responses:
        "200":
          description: List of invoices
        "401":
          $ref: "#/components/responses/Unauthorized"

  /invoices/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      operationId: getInvoice
      summary: Get an invoice
      tags: [Invoices]
      responses:
        "200":
          description: Invoice found
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /invoices/{id}/pay:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    post:
      operationId: payInvoice
      summary: Pay an invoice
      description: Business rule - invoice-payment-window (30 days)
      tags: [Invoices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_method_id]
              properties:
                payment_method_id:
                  type: string
      responses:
        "200":
          description: Payment processed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          description: Payment required / failed
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /usage/{subscription_id}:
    parameters:
      - name: subscription_id
        in: path
        required: true
        schema: { type: integer }
      - name: period_start
        in: query
        schema: { type: string, format: date-time }
      - name: period_end
        in: query
        schema: { type: string, format: date-time }
    get:
      operationId: getUsage
      summary: Get usage summary for a subscription
      description: Business rule - active-subscription-required
      tags: [Usage]
      responses:
        "200":
          description: Usage summary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          description: Active subscription required
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /usage/record:
    post:
      operationId: recordUsage
      summary: Record a usage event
      description: Business rule - usage-quota-enforcement
      tags: [Usage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subscription_id, metric, quantity]
              properties:
                subscription_id:
                  type: integer
                metric:
                  type: string
                quantity:
                  type: integer
                timestamp:
                  type: string
                  format: date-time
                metadata:
                  type: object
      responses:
        "201":
          description: Usage recorded
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          description: Active subscription required
        "422":
          description: Usage quota exceeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  quota:
                    type: integer
                  current_usage:
                    type: integer

  /subscriptions/{subscription_id}/seats:
    parameters:
      - name: subscription_id
        in: path
        required: true
        schema: { type: integer }
    get:
      operationId: listSeats
      summary: List seats for a subscription
      tags: [Seats]
      responses:
        "200":
          description: List of seats with quota info
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: addSeat
      summary: Add a seat to a subscription
      description: Business rule - seat-limit-per-plan
      tags: [Seats]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                role:
                  type: string
                  default: member
      responses:
        "201":
          description: Seat added
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Seat limit reached

  /subscriptions/{subscription_id}/seats/{id}:
    parameters:
      - name: subscription_id
        in: path
        required: true
        schema: { type: integer }
      - name: id
        in: path
        required: true
        schema: { type: integer }
    delete:
      operationId: removeSeat
      summary: Remove a seat from a subscription
      tags: [Seats]
      responses:
        "200":
          description: Seat removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /plans:
    get:
      operationId: listPlans
      summary: List all available plans
      tags: [Plans]
      responses:
        "200":
          description: List of plans
        "401":
          $ref: "#/components/responses/Unauthorized"

  /plans/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      operationId: getPlan
      summary: Get a plan by ID
      tags: [Plans]
      responses:
        "200":
          description: Plan found
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /coupons/validate:
    post:
      operationId: validateCoupon
      summary: Validate a coupon code
      description: Business rule - coupon-single-use
      tags: [Coupons]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        "200":
          description: Coupon is valid
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Coupon is invalid or already used

  /audit-logs:
    get:
      operationId: listAuditLogs
      summary: List audit logs
      tags: [Audit Logs]
      parameters:
        - name: user_id
          in: query
          schema: { type: integer }
        - name: action
          in: query
          schema: { type: string }
        - name: resource_type
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: page
          in: query
          schema: { type: integer }
        - name: per_page
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: List of audit logs
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /webhooks:
    post:
      operationId: receiveWebhook
      summary: Receive webhook events from payment processor
      tags: [Webhooks]
      security: []
      parameters:
        - name: X-Webhook-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event, payload]
              properties:
                event:
                  type: string
                  enum:
                    - payment.succeeded
                    - payment.failed
                    - subscription.renewed
                    - subscription.expired
                    - invoice.created
                payload:
                  type: object
      responses:
        "200":
          description: Webhook received
        "401":
          description: Invalid webhook signature

  /admin/health:
    get:
      operationId: adminHealth
      summary: Check system health
      tags: [Admin]
      responses:
        "200":
          description: System healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [healthy, degraded]
                  timestamp:
                    type: string
                    format: date-time
                  version:
                    type: string
                  checks:
                    type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: System degraded

  /admin/stats:
    get:
      operationId: adminStats
      summary: Get platform statistics
      tags: [Admin]
      responses:
        "200":
          description: Platform statistics
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

tags:
  - name: Users
    description: User management endpoints
  - name: Subscriptions
    description: Subscription lifecycle management
  - name: Invoices
    description: Invoice management and payment processing
  - name: Usage
    description: Usage tracking and quota enforcement
  - name: Seats
    description: Multi-user seat management
  - name: Plans
    description: Available subscription plans
  - name: Coupons
    description: Discount coupon validation
  - name: Audit Logs
    description: Security and compliance audit trail
  - name: Webhooks
    description: Payment processor webhook receiver
  - name: Admin
    description: Administrative endpoints
