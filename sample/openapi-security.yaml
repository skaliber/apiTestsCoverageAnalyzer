openapi: "3.0.0"
info:
  title: Security Sample API
  version: "1.0.0"
servers:
  - url: https://api.example.com/v1
    description: Production server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      name: X-Api-Key
      in: header
    OAuth2Auth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.example.com/oauth/authorize
          tokenUrl: https://auth.example.com/oauth/token
          scopes:
            read: Read access
            write: Write access
    SessionCookie:
      type: apiKey
      name: session_id
      in: cookie

security:
  - BearerAuth: []

paths:
  /users:
    get:
      summary: List users
      security:
        - BearerAuth: []
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [admin, user, guest]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: A list of users
        "400":
          description: Invalid query parameters
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
    post:
      summary: Create a user
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                role:
                  type: string
                  enum: [admin, user]
      responses:
        "201":
          description: User created
        "400":
          description: Invalid input or missing required field
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - insufficient privileges

  /users/{id}:
    get:
      summary: Get a user by ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: User found
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: User not found
    put:
      summary: Update a user
      security:
        - BearerAuth: []
        - OAuth2Auth:
            - write
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                email:
                  type: string
                  format: email
                role:
                  type: string
                  enum: [admin, user]
      responses:
        "200":
          description: User updated
        "400":
          description: Invalid input
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: User not found

  /items:
    get:
      summary: List items
      security:
        - ApiKeyAuth: []
      parameters:
        - name: category
          in: query
          schema:
            type: string
            pattern: "^[a-zA-Z0-9_-]+$"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Items list
        "400":
          description: Invalid query parameter
        "401":
          description: Missing or invalid API key
        "403":
          description: Forbidden

  /auth/login:
    post:
      summary: Log in and obtain a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  minLength: 1
                password:
                  type: string
                  minLength: 1
      responses:
        "200":
          description: Login successful, returns JWT token
        "400":
          description: Missing or invalid credentials
        "401":
          description: Invalid username or password

  /auth/logout:
    post:
      summary: Log out and invalidate session
      security:
        - BearerAuth: []
        - SessionCookie: []
      responses:
        "204":
          description: Logged out
        "401":
          description: Not authenticated
