openapi: "3.0.0"
info:
  title: Error Scenarios Sample API
  version: "1.0.0"
paths:
  /users:
    post:
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                email:
                  type: string
                  format: email
      responses:
        "201":
          description: User created
        "400":
          description: Missing required field or invalid input
        "401":
          description: Unauthorized - missing or invalid token
        "409":
          description: Email already in use
  /users/{id}:
    get:
      summary: Get a user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: User found
        "400":
          description: Invalid ID format or value
        "401":
          description: Unauthorized
        "404":
          description: User not found
    put:
      summary: Update a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
      responses:
        "200":
          description: User updated
        "400":
          description: Invalid input value
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - cannot update another user
        "404":
          description: User not found
    delete:
      summary: Delete a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: User deleted
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: User not found
  /items:
    get:
      summary: List items
      parameters:
        - name: X-Api-Key
          in: header
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Items list
        "400":
          description: Invalid query parameters
        "401":
          description: Missing or invalid API key
        "500":
          description: Internal server error
