[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts =
    -v
    --tb=short
    --strict-markers

markers =
    unit: Unit tests (no external dependencies)
    integration: Integration / flow tests
    security: Security-focused tests
    slow: Tests that take > 1s to run
