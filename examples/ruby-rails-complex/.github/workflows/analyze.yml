name: API Coverage Analysis

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

env:
  RAILS_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ruby_rails_complex_test
  REDIS_URL: redis://localhost:6379/0
  WEBHOOK_SECRET: test_webhook_secret_ci
  APP_VERSION: ${{ github.sha }}

jobs:
  test:
    name: RSpec Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ruby_rails_complex_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby 3.2
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Install dependencies
        run: bundle install --jobs 4 --retry 3

      - name: Set up database
        run: |
          bundle exec rails db:create
          bundle exec rails db:schema:load

      - name: Run RSpec (spec-complete)
        run: |
          bundle exec rspec spec/requests/spec-complete \
            --format documentation \
            --format json \
            --out tmp/rspec-results.json

      - name: Upload RSpec results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rspec-results
          path: tmp/rspec-results.json
          retention-days: 30

  coverage-analysis:
    name: API Coverage Analysis
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install API Coverage Analyzer
        run: npm install -g @q-intel/api-tests-coverage-analyzer

      - name: Run coverage analysis (spec-initial - ~50% baseline)
        run: |
          api-coverage analyze \
            --config config.yaml \
            --test-dir spec/requests/spec-initial \
            --output-dir coverage-reports/initial \
            --format html,json
        continue-on-error: true

      - name: Run coverage analysis (spec-complete - 100% target)
        run: |
          api-coverage analyze \
            --config config.yaml \
            --test-dir spec/requests/spec-complete \
            --output-dir coverage-reports/complete \
            --format html,json

      - name: Upload initial coverage report (50% baseline)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-initial-50pct
          path: coverage-reports/initial/
          retention-days: 90

      - name: Upload complete coverage report (100%)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-complete-100pct
          path: coverage-reports/complete/
          retention-days: 90

      - name: Check coverage thresholds
        run: |
          COVERAGE=$(cat coverage-reports/complete/coverage-report.json | jq '.summary.endpointCoverage')
          echo "Endpoint coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 100" | bc -l) )); then
            echo "Coverage is below 100% threshold"
            exit 1
          fi

      - name: Post coverage summary as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('coverage-reports/complete/coverage-report.json'));
            const summary = report.summary;

            const comment = `## API Coverage Report

            | Metric | Coverage |
            |--------|----------|
            | Endpoints | ${summary.endpointCoverage}% |
            | Business Rules | ${summary.businessRuleCoverage}% |
            | Error Scenarios | ${summary.errorScenarioCoverage}% |
            | Auth Flows | ${summary.authCoverage}% |

            Generated by [API Tests Coverage Analyzer](https://github.com/q-intel/apiTestsCoverageAnalyzer)
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  lint:
    name: RuboCop Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - name: Run RuboCop
        run: bundle exec rubocop --format github
        continue-on-error: true
