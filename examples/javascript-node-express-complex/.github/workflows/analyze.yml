name: API Coverage Analysis

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run nightly at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      tests_dir:
        description: "Test directory to analyze (tests-initial or tests-complete)"
        required: false
        default: "tests-complete"
      threshold:
        description: "Coverage threshold percentage (0-100)"
        required: false
        default: "90"

env:
  NODE_VERSION: "20"
  TESTS_DIR: ${{ github.event.inputs.tests_dir || 'tests-complete' }}
  COVERAGE_THRESHOLD: ${{ github.event.inputs.threshold || '90' }}

jobs:
  # ── Install & lint ─────────────────────────────────────────────────────────
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: examples/javascript-node-express-complex/package-lock.json

      - name: Install API dependencies
        working-directory: examples/javascript-node-express-complex
        run: npm ci

      - name: Install root analyzer dependencies
        run: npm ci

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            examples/javascript-node-express-complex/node_modules
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

  # ── Unit tests ─────────────────────────────────────────────────────────────
  test:
    name: Run Jest tests
    runs-on: ubuntu-latest
    needs: install
    defaults:
      run:
        working-directory: examples/javascript-node-express-complex

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: examples/javascript-node-express-complex/package-lock.json

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            examples/javascript-node-express-complex/node_modules
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Run initial tests (before coverage improvement)
        run: npm run test:initial -- --reporter=github-actions 2>&1 || true
        continue-on-error: true

      - name: Run complete tests
        run: npm run test:complete -- --reporter=github-actions

      - name: Run full test suite with coverage
        run: npm test -- --coverage --coverageReporters=lcov --coverageReporters=text

      - name: Upload Jest coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          directory: examples/javascript-node-express-complex/coverage
          flags: unittests
          fail_ci_if_error: false

  # ── API coverage analysis ──────────────────────────────────────────────────
  api-coverage:
    name: API Endpoint Coverage Analysis
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: examples/javascript-node-express-complex

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "package-lock.json"

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            examples/javascript-node-express-complex/node_modules
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      # ── Analyze initial test coverage (shows gaps) ──────────────────────
      - name: Analyze INITIAL test coverage (baseline)
        run: |
          node scripts/run-analyzer.js \
            --tests   tests-initial \
            --format  json \
            --output  ./reports/initial
        continue-on-error: true

      # ── Analyze complete test coverage ──────────────────────────────────
      - name: Analyze COMPLETE test coverage
        run: |
          node scripts/run-analyzer.js \
            --tests     ${{ env.TESTS_DIR }} \
            --format    html \
            --output    ./reports/complete \
            --threshold ${{ env.COVERAGE_THRESHOLD }}

      # ── Publish coverage reports ─────────────────────────────────────────
      - name: Upload coverage reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage-reports-${{ github.sha }}
          path: examples/javascript-node-express-complex/reports/
          retention-days: 30

      - name: Upload initial coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage-initial-${{ github.sha }}
          path: examples/javascript-node-express-complex/reports/initial/
          retention-days: 30

      # ── GitHub Step Summary ───────────────────────────────────────────────
      - name: Publish coverage summary to GitHub Step Summary
        if: always()
        run: |
          echo "## API Endpoint Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Project:** logistics-tracking-api" >> $GITHUB_STEP_SUMMARY
          echo "**Tests directory:** \`${{ env.TESTS_DIR }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Threshold:** ${{ env.COVERAGE_THRESHOLD }}%" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Coverage Journey" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Phase | Tests | Endpoints Covered | Coverage |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|-------------------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Initial | tests-initial | shipments + orders (partial) | ~45% |" >> $GITHUB_STEP_SUMMARY
          echo "| Complete | tests-complete | all 25 endpoints | 100% |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Reports uploaded as workflow artifacts." >> $GITHUB_STEP_SUMMARY

      # ── PR Comment with coverage diff ────────────────────────────────────
      - name: Comment on PR with coverage results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'examples/javascript-node-express-complex/reports/complete/coverage-report.json';

            let body = '## API Coverage Analysis Results\n\n';

            if (fs.existsSync(reportPath)) {
              const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
              body += `**Total endpoints:** ${report.totalEndpoints ?? 'N/A'}\n`;
              body += `**Covered:** ${report.coveredEndpoints ?? 'N/A'}\n`;
              body += `**Coverage:** ${report.coveragePercentage ?? 'N/A'}%\n\n`;

              if (report.uncoveredEndpoints?.length > 0) {
                body += '### Uncovered endpoints\n\n';
                report.uncoveredEndpoints.forEach(ep => {
                  body += `- \`${ep.method} ${ep.path}\`\n`;
                });
              }
            } else {
              body += '_Coverage report not available._\n';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              body,
            });

  # ── Security scanning ──────────────────────────────────────────────────────
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: install
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: examples/javascript-node-express-complex
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Run Semgrep SAST scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/javascript
            p/express
            p/security-audit
          output: semgrep-results.sarif
          generateSarif: "1"
        continue-on-error: true

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep
        continue-on-error: true
